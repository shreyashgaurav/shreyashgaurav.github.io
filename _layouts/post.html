---
layout: default
---
{%- assign words = content | strip_html | number_of_words %}
{%- assign minutes = words | divided_by: 220 | plus: 1 %}
<article class="post">
  <header class="post-head">
    <h1>{{ page.title }}</h1>
    <p class="post-meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time>, {{ minutes }} min read</p>
  </header>
  <div class="prose">
{{ content }}
  </div>
  <footer class="post-foot">
    <a href="{{ '/writing/' | relative_url }}">All writing</a>
    <a href="{{ '/feed.xml' | relative_url }}">Subscribe via RSS</a>
  </footer>
</article>
